name: Gradebook CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # JOB 1: BUILD
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: lab10/lab09Copy/starter/pom.xml

      - name: Build application
        working-directory: lab10/lab09Copy/starter
        run: mvn --batch-mode clean compile

  # JOB 2: UNIT TESTS
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: lab10/lab09Copy/starter/pom.xml

      - name: Run unit tests
        working-directory: lab10/lab09Copy/starter
        run: mvn --batch-mode test

  # JOB 3: INTEGRATION TESTS
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: lab10/lab09Copy/starter/pom.xml

      - name: Run integration tests
        working-directory: lab10/lab09Copy/starter
        run: mvn --batch-mode verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradebook-coverage-report
          path: lab10/lab09Copy/starter/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
