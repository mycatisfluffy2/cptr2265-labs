name: Gradebook CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # JOB 1: BUILD
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: lab10/lab09Copy/starter/pom.xml

      - name: Build application
        working-directory: lab10/lab09Copy/starter
        run: mvn --batch-mode clean compile

  # JOB 2: UNIT TESTS
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: lab10/lab09Copy/starter/pom.xml

      - name: Run unit tests
        working-directory: lab10/lab09Copy/starter
        run: mvn --batch-mode test

  # JOB 3: INTEGRATION TESTS
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: lab10/lab09Copy/starter/pom.xml

      - name: Run integration tests
        working-directory: lab10/lab09Copy/starter
        run: mvn --batch-mode verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradebook-coverage-report
          path: lab10/lab09Copy/starter/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
          # New stuff could break this and onward might be bad

  # JOB 4: DEPLOY TO GITHUB CONTAINER REGISTRY
  deploy:
    name: Deploy Docker Image
    runs-on: ubuntu-latest

    needs: [build, unit-tests, integration-tests]

    # Only deploy when changes are pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./lab10/lab09Copy/starter
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

