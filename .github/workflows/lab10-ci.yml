name: Gradebook CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: lab10/lab09Copy/starter/pom.xml

      - name: Run tests
        working-directory: lab10/lab09Copy/starter
        run: mvn --batch-mode clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradebook-coverage-report
          path: lab10/lab09Copy/starter/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14